<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}"/>
    <link rel="apple-touch-icon" href="{{ "favicon.svg" | relURL }}"/>
    <title>{{ if ne .Title .Site.Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
    <link href="{{ "css/styles.css" | relURL }}" rel="stylesheet"/>
    {{ range .Site.Params.css -}}
        <link href="{{ . | relURL }}" rel="stylesheet"/>
    {{- end }}
    {{ partial "extra_head.html" . }}
</head>
