    <script>
        function adjustTextColor(sectionId) {
            const section = document.getElementById(sectionId);
            const style = window.getComputedStyle(section);
            const imageUrl = style
                .backgroundImage
                .slice(4, -1)
                .replace(/["']/g, "");
            const image = new Image();
            image.src = imageUrl;
            image.onload = function () {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = image.width;
                canvas.height = image.height;
                context.drawImage(image, 0, 0, image.width, image.height);
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                let r = 0,
                    g = 0,
                    b = 0;
                for (let i = 0; i < data.length; i += 4) {
                    r += data[i];
                    g += data[i + 1];
                    b += data[i + 2];
                }
                r /= (data.length / 4);
                g /= (data.length / 4);
                b /= (data.length / 4);
                const brightness = Math.sqrt(0.299 * r * r + 0.587 * g * g + 0.114 * b * b);
                const textColor = brightness > 128
                    ? 'black'
                    : 'white';
                const shadowColor = brightness > 128
                    ? 'rgba(255, 255, 255, 0.7)'
                    : 'rgba(0, 0, 0, 0.7)';
                const textOverlay = document.getElementById('textOverlay');
                textOverlay.style.color = textColor;
                textOverlay.style.textShadow = `0 0 5px ${shadowColor}, 0 0 10px ${shadowColor}, 0 0 20px ${shadowColor}, 0 0 40px ${shadowColor}, 0 0 80px ${shadowColor}, 0 0 90px ${shadowColor}, 0 0 100px ${shadowColor}, 0 0 150px ${shadowColor}`;
            };
        }
        
        adjustTextColor('heroSection');
    </script>

    "content": "I\u0026rsquo;m Burak. Wrapping up my Computer Engineering degree at Alanya Alaaddin Keykubat University, thesis only. I support my own university and help other small businesses and startup teams ship their software faster and worry less about it breaking. Usually that means Docker, CI/CD pipelines, and AWS infrastructure built with Terraform.\nThree internships so far across Turkey, Spain, and Poland, covering web, data, and DevOps. The DevOps one at Konsalt in Istanbul was the one that stuck: Jenkins pipelines, a three-node Kubernetes cluster, and GitOps with ArgoCD.\nIf your app needs a real deployment story instead of a laptop and a prayer, let\u0026rsquo;s talk.\nExperience Konsalt Bilgi Teknolojileri — DevOps Intern Aug 2025 – Sep 2025 · Kadıköy, Istanbul\nImplemented 5 CI/CD pipelines with Jenkins to fully automate build, test, and deploy. Configured a 3-node Kubernetes cluster from scratch on Linux/Ubuntu VMs, including SSH access and node networking. Applied a GitOps approach with ArgoCD to enforce cluster state and manage advanced rollout strategies. Containerized 5 web applications with Docker and packaged them with Helm. Linux server admin and infrastructure automation keeping 99.9% uptime on internal dev services. Universidad de Castilla-La Mancha (Alarcos Group) — Data Engineering Intern Jun 2025 – Aug 2025 · Ciudad Real, Spain\nDesigned scalable, extensible database schemas for research data workflows. Built ETL pipelines to pull, clean, and deduplicate data from 5 researcher-hub APIs, spreadsheets, and experimental sources. Produced structured datasets for 40+ researchers, queryable via SQL. Contributed to web-based data interfaces for visualizing and manipulating research datasets. AGH University of Krakow — Data Science Intern (Quality of Experience Lab) Jul 2024 – May 2025 · Krakow, Poland\nParallelized FFMPEG across 6 lab machines, cutting video processing from 14 hours to 4.2 (−70%). Automated 90% of pre-processing and organization for 600+ video sequences with Python (pandas/NumPy) and FFMPEG. Filtered 65% of noisy responses with ITU-T P.910 outlier detection, improving dataset validity. Hit 90% participant completion rates by optimizing Prolific experiment design. Shipped 100+ publication-ready Matplotlib visualizations for research papers. Freelance Web Developer Oct 2023 – Mar 2024 · Alanya, Türkiye\nDelivered 6+ front-end-heavy projects for local businesses and Upwork clients using React and Firebase (full-stack). Responsive UIs, real-time databases, auth, and hosting. Ended with 95% client satisfaction and 3 repeat contracts. ANT Arge Teknoloji — Web Developer Nov 2022 – Sep 2023 · Antalya, Türkiye\nShipped 5 production-ready MVPs (React/Firebase) serving 2,000+ users across 100+ businesses. Improved user retention 25% via React optimizations (3.2s → 1.6s load, measured on Lighthouse). Introduced SCRUM via Asana on a 12-person team; task completion time down 30%. Community NEXUS ALKÜ — Co-founder \u0026amp; Software Engineer May 2025 – Present · Alanya, Türkiye\nCo-founded NEXUS, a 200+ engineer non-profit community at Alanya Alaaddin Keykubat University. I run Docker and CI/CD bootcamps for incoming engineers and lead the NEXUS Dev Team, which builds and maintains the internal platforms that several university departments actually run on. Lead an 8-person managing board; direct operations and logistics for 12 educational events. Education Alanya Alaaddin Keykubat University — Bachelor of Engineering, Computer Engineering (Sep 2022 – Jun 2027)\nLanguages English (fluent), Turkish (native), Spanish (working).\n",
